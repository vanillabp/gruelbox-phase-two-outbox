name: Release 🚀
# A release is started by hand and does three things: it publishes the artifacts to Maven
# Central from a release branch, it leaves a tag and a draft release behind, and it opens
# the pull request which carries the version bump back into main.
#
# It cannot run while any version in a POM is a SNAPSHOT. This repository's own version is
# set by the workflow, so a SNAPSHOT left over is a dependency on an unreleased VanillaBP,
# which here is the platform and the BPMS double its tests boot against. Maven Central
# refuses such a dependency, and it refuses it after the build, which is why the check below
# ends the run before anything is signed.
"on":
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to release (e.g. 1.0.0)
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # the bundle: "Bundle has content that does NOT have a .pom file". The runner image
      # ships 3.10 now, so the release brings its own 3.9. Remove this step once a plugin
      # version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Extract last released version
        run: |
          apiUrl="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          lastReleasedVersionApiResult=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "${apiUrl}")
          lastReleasedVersion=$(echo "${lastReleasedVersionApiResult}" \
            | jq -r '.tag_name')
          if [ "${lastReleasedVersion}" = "null" ] || [ -z "${lastReleasedVersion}" ]; then
            echo "No GitHub release found using ${apiUrl}, falling back to first commit"

            git fetch --quiet --depth=1 origin
            firstCommit=$(git rev-list --max-parents=0 HEAD)

            lastReleasedVersion="${firstCommit}"
          else
            lastReleasedVersion="${lastReleasedVersion#v}"
          fi
          echo "LAST_RELEASED_VERSION=${lastReleasedVersion}" >> "${GITHUB_ENV}"
          echo "Last released version: ${lastReleasedVersion}"
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS
          cache: maven
          server-id: vanillabp-central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: GPG_PASSPHRASE
          gpg-private-key: "${{ secrets.MAVEN_GPG_PRIVATE_KEY }}"
      - name: Create release branch
        run: |
          git checkout -b release/${{ github.event.inputs.release_version }} origin/main
      - name: Set Maven release version
        run: |
          mvn --batch-mode --update-snapshots versions:set -DprocessAllModules=true -DnewVersion=${{ github.event.inputs.release_version }}
          find . -name pom.xml.versionsBackup -delete
      - name: Refuse a release which depends on something unreleased
        run: |
          SNAPSHOT_POMS=$(grep -R "<.*>.*SNAPSHOT<\/.*>" . --include=pom.xml || true)

          if [ -n "$SNAPSHOT_POMS" ]; then
            echo "::error::A SNAPSHOT is left in a POM, so this release would depend on an unreleased VanillaBP. Release what it points at first (the platform, whose modules this store and its tests use), then raise the versions here:"
            echo "$SNAPSHOT_POMS"
            exit 1
          fi
          echo "✅ No SNAPSHOT dependencies found."
      - name: Build & deploy to Maven Central
        run: |
          mvn --batch-mode -Dgpg.passphrase=$GPG_PASSPHRASE \
          clean deploy -P release,central-portal
        env:
          GPG_PASSPHRASE: "${{ secrets.MAVEN_GPG_PASSPHRASE }}"
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
      - name: Upload the test reports of a failed release
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit release version
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Prepare release v${{ github.event.inputs.release_version }}"
      - name: Create Git tag
        run: |
          git tag -a "${{ github.event.inputs.release_version }}" -m "Release ${{ github.event.inputs.release_version }}"
          git push origin --tags
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.release_version }}"
          name: "v${{ github.event.inputs.release_version }}"
          generate_release_notes: true
          append_body: |2

            **Full Changelog:** [`${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }}`](https://github.com/vanillabp/gruelbox-phase-two-outbox/compare/${{ env.LAST_RELEASED_VERSION }}...${{ github.event.inputs.release_version }})
          draft: true
      - name: Calculate next snapshot version
        run: |
          RELEASE_VERSION=${{ github.event.inputs.release_version }}
          IFS='.' read -r major minor patch <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((patch + 1))
          echo "NEXT_SNAPSHOT=$major.$minor.${NEXT_PATCH}-SNAPSHOT" >> $GITHUB_ENV
      - name: Set next snapshot version
        run: |
          mvn --batch-mode --update-snapshots versions:set -DprocessAllModules=true -DnewVersion=${{ env.NEXT_SNAPSHOT }}
          find . -name pom.xml.versionsBackup -delete
          mvn --batch-mode --update-snapshots -DskipTests -DskipITs package
      - name: Commit next snapshot version
        run: |
          git add -A
          git commit -m "Set next version ${{ env.NEXT_SNAPSHOT }}"
          git push origin HEAD:release/${{ github.event.inputs.release_version }}
      - name: Create PR to merge release branch into main
        run: |
          gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
          gh pr create \
            --title "Merge release/${{ github.event.inputs.release_version }} into main" \
            --body "Automated PR to merge release branch." \
            --base main \
            --head release/${{ github.event.inputs.release_version }}
