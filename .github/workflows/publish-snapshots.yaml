name: Build and publish snapshots
# A pull request builds and tests, a push to main publishes. Both run as the job
# 'publish', which is the check main requires, so a pull request Renovate opens gets a
# result like every other one - it did not while this workflow only listened to pushes
# and ignored renovate/**, and a required check nobody produces waits forever.
#
# Publishing from main alone is the second half of it: there is one snapshot version per
# module, so every branch used to overwrite what main had published in the registry, and
# whoever pushed last decided what the other repositories compiled against.
#
# The snapshots go to two places in one build, with the profile 'publish-snapshots' of the
# POM. GitHub Packages is what the builds of the other VanillaBP repositories read, so they
# do not ask Maven Central for every snapshot and are not stopped by its rate limit. The
# snapshot repository of Maven Central stays for everybody else: anybody can read it there
# without a login.
#
# Only a push to main publishes, and only where the Actions variable VANILLABP_PUBLISH is
# 'true'. The vanillabp organization sets it for all its repositories. A fork does not have
# it, so a push to the main branch of a fork builds and tests like a pull request and
# publishes nothing.
"on":
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
# Where Maven reads the snapshots of the other VanillaBP repositories from, see
# .github/maven/settings.xml: from GitHub Packages once the organization sets the Actions
# variable VANILLABP_SNAPSHOTS_FROM to 'github-packages', else from the snapshot repository of
# Maven Central. Reading GitHub Packages needs a token even for public packages. The
# GITHUB_TOKEN of the run is enough, because every job which runs Maven asks for
# 'packages: read'.
env:
  VBP_SNAPSHOTS_FROM: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && 'github-packages' || 'central' }}"
  # The settings file turns on its profile for GitHub Packages by VBP_SNAPSHOTS_FROM. Maven
  # sees that, but a Quarkus test does not: it resolves the deployment artifacts of the
  # extensions with a resolver of its own inside the test JVM, and that resolver takes the
  # profiles from the Maven command line only. So every Maven call of this workflow also
  # names the profile, by this variable. It is empty for 'central', which leaves the calls
  # as they were.
  VBP_SNAPSHOTS_PROFILE: "${{ vars.VANILLABP_SNAPSHOTS_FROM == 'github-packages' && '-Psnapshots-from-github-packages' || '' }}"
  VBP_PACKAGES_READ_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
concurrency:
  # two pushes to main must not publish at the same time, and the later one has to
  # finish rather than be cancelled: it carries the newer artifacts
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # writes the snapshots to GitHub Packages of this repository and reads those of the
      # other repositories. A pull request from a fork gets a token which can only read,
      # whatever this line says
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Maven 3.10 writes 'maven-metadata-local.xml' and '_remote.repositories' into the
      # staging directory of central-publishing-maven-plugin, and the Central Portal refuses
      # a release bundle with them: "Bundle has content that does NOT have a .pom file". The
      # runner image ships 3.10 now, so this job brings its own 3.9, like the release does.
      # A pull request builds with it too, so it tests with the Maven that main publishes
      # with. Remove this step once a plugin version stages a clean bundle under Maven 3.10.
      - name: Use Maven 3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v6
        with:
          java-version: 25.0.5+8.0.LTS
          distribution: temurin
          cache: maven
      # 'install' and not 'install verify': install already runs every phase verify
      # has, so naming both made Maven walk two lifecycles per module. The tests
      # skipped their second run, the compiler did not, and every javac warning was
      # reported twice - once per compilation.
      - name: Build and test
        if: "${{ github.event_name == 'pull_request' || vars.VANILLABP_PUBLISH != 'true' }}"
        run: mvn -s .github/maven/settings.xml ${VBP_SNAPSHOTS_PROFILE} --batch-mode --no-transfer-progress --update-snapshots install
        env:
          CI: false
      # what a failing test printed is in these reports. Surefire prints its last line,
      # which is never the interesting one.
      - name: Upload the test reports of a failed build
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/*application*.log
          retention-days: 7
          if-no-files-found: ignore
      # the profile 'publish-snapshots' sends the snapshot to GitHub Packages of this
      # repository and to the snapshot repository of Maven Central
      - name: Publish snapshot
        if: "${{ github.event_name == 'push' && vars.VANILLABP_PUBLISH == 'true' }}"
        run: mvn -s .github/maven/settings.xml ${VBP_SNAPSHOTS_PROFILE} --batch-mode --no-transfer-progress --update-snapshots deploy -P publish-snapshots
        env:
          MAVEN_USERNAME: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_USER }}"
          MAVEN_PASSWORD: "${{ secrets.MAVEN_CENTRAL_PORTAL_TOKEN_PW }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CI: false
      - name: Collect coverage reports
        if: "${{ github.event_name == 'push' }}"
        run: |
          mkdir -p coverage
          cp -r test-coverage-report/spring-boot/report coverage/spring-boot-report
      - name: Upload coverage report files as artifact
        if: "${{ github.event_name == 'push' }}"
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage
  deploy-coverage-report:
    if: "${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}"
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
